name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4
      # 2. Set up Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # 3. Cache npm dependencies
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
      # 4. Lint YAML files
      - name: Lint YAML
        run: npx --yes yaml-lint .github/*.yml .github/workflows/*.yml
      # 5. Install dependencies
      - name: Install dependencies
        run: npm ci
      # 6. Build the project
      - name: Build
        run: npm run build
      # 7. Run tests
      - name: Run tests
        run: npm test
